<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Interactive Page</h1>

  <!-- 1. Mouse click: light / dark theme -->
  <div class="box">
    <h2>Switch the theme</h2>
    <button id="themeBtn">Dark Mode</button>
  </div>

  <!-- 2. Keyboard: live text preview -->
  <div class="box">
    <h2>Type something</h2>
    <input id="textInput" type="text" placeholder="Start typing...">
    <p id="preview">Your text will show here</p>
    <p id="count">Characters: 0</p>
  </div>

  <!-- 3. Time: live clock -->
  <div class="box">
    <h2>Current time</h2>
    <p id="clock"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
