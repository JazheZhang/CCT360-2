<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Page</title>

  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>


  <button id="themeBtn" class="btn">Dark Mode</button>
  <h1>Interactive Page</h1>
  <div class="container">

    <div class="box">
      <h2>Switch the theme</h2>
      <p>Click the button in the top corner. The theme is now <span id="themeName" class="highlight">light</span>.</p>
    </div>


    <div class="box">
      <h2>Type something</h2>
      <input id="textInput" type="text" placeholder="Start typing...">
      <p id="preview">Your text will show here</p>
      <p>Characters: <span id="count" class="highlight">0</span></p>
    </div>

    <div class="box">
      <h2>Time and window</h2>
      <p id="clock"></p>
      <p id="windowSize"></p>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
